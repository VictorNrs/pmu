# Whole application: `docker compose up -d --build`, then open http://localhost:8088
services:
  postgres:
    image: postgres:17-alpine
    container_name: pmu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmu
      POSTGRES_PASSWORD: pmu_local_password
      POSTGRES_DB: pmu_dev
    ports:
      # Exposed on the host only for development tools and automated tests.
      - '55432:5432'
    volumes:
      - pmu-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmu -d pmu_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: pmu-app
    container_name: pmu-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pmu:pmu_local_password@postgres:5432/pmu_dev
    ports:
      - '8088:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  pmu-postgres-data:
